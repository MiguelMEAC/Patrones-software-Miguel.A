name: CI/CD Pipeline - SmartOrders Enterprise

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Unit Tests & JaCoCo Coverage (>= 80%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilación, Ejecución de Tests y Verificación JaCoCo
        working-directory: ./smartgrid/smartgrid
        run: |
          mvn clean verify --batch-mode

      - name: Publicar Reporte JaCoCo como Artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: smartgrid/smartgrid/target/site/jacoco/
          retention-days: 14

      - name: Empaquetar JAR Ejecutable de Producción
        working-directory: ./smartgrid/smartgrid
        run: |
          mvn package -DskipTests
          ls -lh target/*.jar
