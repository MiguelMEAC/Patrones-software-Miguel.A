spring.application.name=smartorders
server.port=8080

# Configuracion de Base de Datos H2 por defecto (ejecucion inmediata sin configuracion externa)
spring.datasource.url=jdbc:h2:mem:smartorders;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Monitoreo y Metricas Centralizadas (Prometheus / Actuator)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# Logging estructurado y auditoria
logging.level.root=INFO
logging.level.com.smartorders=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n